name = "photopea-mcp-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-11-13"
workers_dev = true

[[durable_objects.bindings]]
name = "PHOTOPEA_BRIDGE"
class_name = "PhotopeaBridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhotopeaBridge"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
