<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photopea MCP Bridge</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    /* -------------------------------------------------------------------------
       Layout: column flex — status bar / iframe / log panel
    ------------------------------------------------------------------------- */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* -------------------------------------------------------------------------
       Status bar
    ------------------------------------------------------------------------- */
    #status-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 36px;
      background: #2d2d2d;
      border-bottom: 1px solid #3a3a3a;
      user-select: none;
    }

    #github-star {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #333;
      border: 1px solid #555;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    #github-star:hover {
      background: #444;
      border-color: #777;
      color: #fff;
    }
    #github-star svg {
      fill: #ccc;
    }
    #github-star:hover svg {
      fill: #f0c14b;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      flex-shrink: 0;
      transition: background 0.25s ease;
    }

    #status-dot.connected {
      background: #2ecc71;
    }

    #status-text {
      color: #aaa;
      font-size: 12px;
      min-width: 100px;
    }

    #doc-info {
      margin-left: auto;
      color: #777;
      font-size: 11px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    /* -------------------------------------------------------------------------
       Photopea iframe
    ------------------------------------------------------------------------- */
    #photopea-wrap {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    #photopea {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* -------------------------------------------------------------------------
       Activity log panel
    ------------------------------------------------------------------------- */
    #log-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      background: #252525;
      border-top: 1px solid #3a3a3a;
      max-height: 30vh;
      transition: max-height 0.2s ease;
    }

    #log-panel.collapsed {
      max-height: 28px;
    }

    #log-header {
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: pointer;
      background: #2d2d2d;
      border-bottom: 1px solid #3a3a3a;
      user-select: none;
      gap: 8px;
    }

    #log-header:hover {
      background: #333;
    }

    #log-title {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    #log-count {
      font-size: 11px;
      color: #666;
      margin-left: auto;
    }

    #log-chevron {
      font-size: 10px;
      color: #666;
      transition: transform 0.2s ease;
    }

    #log-panel.collapsed #log-chevron {
      transform: rotate(180deg);
    }

    #log-entries {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 4px 0;
    }

    #log-entries::-webkit-scrollbar {
      width: 6px;
    }

    #log-entries::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    #log-entries::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    .log-entry {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      border-left: 2px solid transparent;
    }

    .log-entry:hover {
      background: #2a2a2a;
    }

    .log-entry.entry-ok {
      border-left-color: #2ecc71;
    }

    .log-entry.entry-err {
      border-left-color: #e74c3c;
    }

    .log-ts {
      color: #555;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-tool {
      color: #569cd6;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-summary {
      color: #d4d4d4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #log-empty {
      padding: 8px 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- Status bar -->
    <div id="status-bar">
      <div id="status-dot"></div>
      <span id="status-text">Connecting...</span>
      <span id="doc-info"></span>
      <a id="github-star" href="https://github.com/vibe-promax/Photopea-mcp" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/></svg>
        Star on GitHub
      </a>
    </div>

    <!-- Photopea iframe -->
    <div id="photopea-wrap">
      <iframe
        id="photopea"
        src="https://www.photopea.com#%7B%7D"
      ></iframe>
    </div>

    <!-- Activity log -->
    <div id="log-panel">
      <div id="log-header">
        <span id="log-title">Activity Log</span>
        <span id="log-count">0 entries</span>
        <span id="log-chevron">&#9650;</span>
      </div>
      <div id="log-entries">
        <div id="log-empty">No activity yet.</div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      // -----------------------------------------------------------------------
      // DOM refs
      // -----------------------------------------------------------------------
      var dot        = document.getElementById('status-dot');
      var statusText = document.getElementById('status-text');
      var docInfo    = document.getElementById('doc-info');
      var logPanel   = document.getElementById('log-panel');
      var logHeader  = document.getElementById('log-header');
      var logEntries = document.getElementById('log-entries');
      var logCount   = document.getElementById('log-count');
      var logEmpty   = document.getElementById('log-empty');

      // -----------------------------------------------------------------------
      // State
      // -----------------------------------------------------------------------
      var ws              = null;
      var wsReady         = false;
      var photopeaReady   = false;
      var entryCount      = 0;
      var reconnectDelay  = 1000;   // ms; doubles up to MAX_DELAY
      var MAX_DELAY       = 10000;
      var reconnectTimer  = null;

      // Per-execution buffering
      var pendingId       = null;
      var echoBuffer      = [];     // string messages from Photopea before "done"
      var fileBuffer      = null;   // ArrayBuffer from Photopea (last one wins)
      var previewMaxSize  = 0;      // > 0: downscale the exported PNG before sending
      var commandQueue    = [];
      var commandBusy     = false;
      var probeInFlight   = false;
      var probeCounter    = 0;

      // -----------------------------------------------------------------------
      // Collapsible log
      // -----------------------------------------------------------------------
      logHeader.addEventListener('click', function () {
        logPanel.classList.toggle('collapsed');
      });

      // -----------------------------------------------------------------------
      // Status helpers
      // -----------------------------------------------------------------------
      function setConnected(connected) {
        wsReady = connected;
        if (connected) {
          dot.classList.add('connected');
          statusText.textContent = photopeaReady ? 'Connected — Photopea ready' : 'Connected — waiting for Photopea';
        } else {
          dot.classList.remove('connected');
          statusText.textContent = 'Disconnected';
        }
      }

      function setPhotopeaReady() {
        photopeaReady = true;
        if (wsReady) {
          statusText.textContent = 'Connected — Photopea ready';
        }
      }

      // -----------------------------------------------------------------------
      // Activity log
      // -----------------------------------------------------------------------
      function addLogEntry(tool, summary, isError) {
        if (logEmpty.parentNode) {
          logEmpty.remove();
        }

        entryCount++;
        updateLogCount();

        var now   = new Date();
        var hh    = String(now.getHours()).padStart(2, '0');
        var mm    = String(now.getMinutes()).padStart(2, '0');
        var ss    = String(now.getSeconds()).padStart(2, '0');
        var ts    = hh + ':' + mm + ':' + ss;

        var entry = document.createElement('div');
        entry.className = 'log-entry ' + (isError ? 'entry-err' : 'entry-ok');

        var tsEl = document.createElement('span');
        tsEl.className = 'log-ts';
        tsEl.textContent = ts;

        var toolEl = document.createElement('span');
        toolEl.className = 'log-tool';
        toolEl.textContent = tool;

        var summaryEl = document.createElement('span');
        summaryEl.className = 'log-summary';
        summaryEl.textContent = summary;

        entry.appendChild(tsEl);
        entry.appendChild(toolEl);
        entry.appendChild(summaryEl);
        logEntries.appendChild(entry);

        if (entryCount > 100) {
          logEntries.removeChild(logEntries.firstChild);
          entryCount--;
        }

        // Auto-scroll to bottom
        logEntries.scrollTop = logEntries.scrollHeight;
      }

      function updateLogCount() {
        logCount.textContent = entryCount + (entryCount === 1 ? ' entry' : ' entries');
      }

      // -----------------------------------------------------------------------
      // WebSocket connection
      // -----------------------------------------------------------------------
      function connect() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }

        var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var url = protocol + '//' + location.host + '/bridge';

        try {
          ws = new WebSocket(url);
          ws.binaryType = 'arraybuffer';
        } catch (err) {
          scheduleReconnect();
          return;
        }

        ws.onopen = function () {
          reconnectDelay = 1000;
          setConnected(true);
          if (photopeaReady) {
            sendToWS({ type: 'status', status: 'ready' });
            probePhotopea();
          }
        };

        ws.onclose = function (event) {
          setConnected(false);
          // Never leave an abandoned command blocking the serialized queue after a socket drop.
          pendingId = null;
          echoBuffer = [];
          fileBuffer = null;
          commandBusy = false;
          commandQueue = [];
          // 4001 = the server switched to a newer tab; reconnecting would steal the session back
          if (event.code === 4001) {
            statusText.textContent = 'Session moved to another tab. You can close this one.';
            return;
          }
          scheduleReconnect();
        };

        ws.onerror = function () {
          // onclose fires right after; no extra handling needed
        };

        ws.onmessage = function (event) {
          if (event.data instanceof ArrayBuffer) {
            handleLoadBinary(event.data);
            return;
          }
          var msg;
          try {
            msg = JSON.parse(event.data);
          } catch (e) {
            return;
          }
          handleServerMessage(msg);
        };
      }

      function scheduleReconnect() {
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          connect();
        }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, MAX_DELAY);
      }

      function sendToWS(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(obj));
        }
      }

      function probePhotopea() {
        if (!photopeaReady || !wsReady || commandBusy || commandQueue.length || probeInFlight) return;
        probeInFlight = true;
        var token = String(Date.now()) + '_' + (++probeCounter);
        commandQueue.push({
          kind: 'probe',
          id: 'probe:' + token,
          script: "app.echoToOE('MCP_PONG:" + token + "');"
        });
        processCommandQueue();
      }

      // A heartbeat is accepted only after Photopea itself echoes a fresh probe.
      // This detects a frozen iframe, not merely a live outer browser tab.
      setInterval(probePhotopea, 15000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) probePhotopea();
      });

      // -----------------------------------------------------------------------
      // Server -> client message handling
      // -----------------------------------------------------------------------
      function handleServerMessage(msg) {
        if (msg.type === 'execute') {
          handleExecute(msg);
        } else if (msg.type === 'load') {
          handleLoad(msg);
        } else if (msg.type === 'activity') {
          addLogEntry(msg.tool || 'tool', msg.summary || '', false);
        }
      }

      // -----------------------------------------------------------------------
      // Execute: forward script to Photopea, collect results, send back
      // -----------------------------------------------------------------------
      function handleExecute(msg) {
        commandQueue.push({ kind: 'script', id: msg.id, script: msg.script, previewMaxSize: msg.previewMaxSize || 0 });
        processCommandQueue();
      }

      function processCommandQueue() {
        if (commandBusy || !photopeaReady || !wsReady || commandQueue.length === 0) return;
        commandBusy = true;
        var command = commandQueue.shift();
        pendingId = command.id;
        echoBuffer = [];
        fileBuffer = null;
        previewMaxSize = command.previewMaxSize || 0;
        var iframe = document.getElementById('photopea');
        if (!iframe || !iframe.contentWindow) {
          sendToWS({ type: 'result', id: command.id, success: false, error: 'Photopea iframe is unavailable.' });
          pendingId = null;
          commandBusy = false;
          processCommandQueue();
          return;
        }
        if (command.kind === 'binary') iframe.contentWindow.postMessage(command.payload, '*');
        else iframe.contentWindow.postMessage(command.script, '*');
      }

      function sendToPhotopea(payload) {
        var iframe = document.getElementById('photopea');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage(payload, '*');
        }
      }

      // -----------------------------------------------------------------------
      // Load: decode base64 and push ArrayBuffer to Photopea
      // -----------------------------------------------------------------------
      function handleLoad(msg) {
        var id       = msg.id;
        var b64      = msg.data;
        var filename = msg.filename;

        var binary;
        try {
          binary = atob(b64);
        } catch (e) {
          sendToWS({ type: 'result', id: id, success: false, data: null, error: 'base64 decode failed' });
          return;
        }

        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        commandQueue.push({ kind: 'binary', id: id, payload: bytes.buffer });
        processCommandQueue();
      }

      // Receive raw file bytes from the Cloudflare bridge (36-byte request ID prefix).
      function handleLoadBinary(frame) {
        var bytes = new Uint8Array(frame);
        if (bytes.byteLength < 36) return;
        var id = new TextDecoder().decode(bytes.subarray(0, 36));
        var payload = bytes.slice(36);
        commandQueue.push({ kind: 'binary', id: id, payload: payload.buffer });
        processCommandQueue();
      }

      // -----------------------------------------------------------------------
      // Photopea -> page message handling (postMessage listener)
      // -----------------------------------------------------------------------
      window.addEventListener('message', function (event) {
        var iframe = document.getElementById('photopea');
        // Only accept messages from the Photopea iframe
        if (!iframe || (iframe.contentWindow && event.source !== iframe.contentWindow)) return;
        var data = event.data;

        // Only Photopea's documented "done" handshake proves readiness.
        // Other messages must never mark the editor ready.
        if (typeof data === 'string' && data === 'done') {
          handlePhotopea_done();
          return;
        }

        // ArrayBuffer = exported file data
        if (data instanceof ArrayBuffer) {
          fileBuffer = data;
          return;
        }

        // String messages
        if (typeof data === 'string') {
          // echoToOE output; ignore unrelated messages while idle.
          if (pendingId !== null) echoBuffer.push(data);
          return;
        }
      });

      function handlePhotopea_done() {
        if (!photopeaReady) {
          // First "done" = Photopea has finished loading
          photopeaReady = true;
          setPhotopeaReady();
          if (wsReady) {
            sendToWS({ type: 'status', status: 'ready' });
          }
          processCommandQueue();
          probePhotopea();
          return;
        }

        // Subsequent "done" = script finished executing
        if (pendingId === null) {
          return;
        }

        var id = pendingId;
        pendingId = null;

        var resultData = echoBuffer.length > 0 ? echoBuffer.join('\n') : null;
        if (id.indexOf('probe:') === 0) {
          var expected = 'MCP_PONG:' + id.substring(6);
          probeInFlight = false;
          if (resultData === expected) {
            sendToWS({ type: 'heartbeat', status: 'ready', at: Date.now() });
          } else {
            photopeaReady = false;
            sendToWS({ type: 'status', status: 'waiting' });
            statusText.textContent = 'Connected — Photopea not responding';
          }
        } else if (fileBuffer !== null) {
          if (previewMaxSize > 0) downscalePng(fileBuffer, previewMaxSize).then(function (buf) { sendFile(id, buf); });
          else sendFile(id, fileBuffer);
        } else {
          // Detect script errors from Photopea's echoed result.
          var hasError = resultData !== null && /^(ReferenceError|TypeError|SyntaxError|Error|RangeError):/.test(resultData);
          sendToWS({
            type:    'result',
            id:      id,
            success: !hasError,
            data:    hasError ? null : resultData,
            error:   hasError ? resultData : null
          });
        }

        echoBuffer = [];
        fileBuffer = null;
        commandBusy = false;
        processCommandQueue();
      }

      // Binary frame: 36-char request id, then the raw file (no base64, so large PSDs fit)
      function sendFile(id, buf) {
        var out = new Uint8Array(36 + buf.byteLength);
        for (var i = 0; i < 36; i++) out[i] = id.charCodeAt(i);
        out.set(new Uint8Array(buf), 36);
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(out);
      }

      // Previews are scaled here, not in Photopea, so the document itself is never modified
      function downscalePng(buf, max) {
        return createImageBitmap(new Blob([buf])).then(function (bmp) {
          var s = Math.min(1, max / Math.max(bmp.width, bmp.height));
          if (s === 1) return buf;
          var c = new OffscreenCanvas(Math.max(1, Math.round(bmp.width * s)), Math.max(1, Math.round(bmp.height * s)));
          var ctx = c.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(bmp, 0, 0, c.width, c.height);
          return c.convertToBlob({ type: 'image/png' }).then(function (b) { return b.arrayBuffer(); });
        }).catch(function () { return buf; });
      }

      // -----------------------------------------------------------------------
      // If Photopea reloads, invalidate readiness until its new "done" handshake.
      document.getElementById('photopea').addEventListener('load', function () {
        photopeaReady = false;
        if (wsReady) sendToWS({ type: 'status', status: 'waiting' });
        statusText.textContent = wsReady ? 'Connected — waiting for Photopea' : 'Disconnected';
      });

      // Boot
      // -----------------------------------------------------------------------
      setConnected(false);
      connect();

    }());
  </script>
</body>
</html>
